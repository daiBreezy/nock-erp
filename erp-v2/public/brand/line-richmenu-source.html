<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:2500px;height:1686px;font-family:"Sukhumvit Set","Thonburi",sans-serif}
.wrap{display:grid;grid-template-rows:843px 843px;width:2500px;height:1686px;gap:0}
.a{background:linear-gradient(135deg,#d9304f,#b81e3d);color:#fff;display:flex;align-items:center;gap:90px;padding:0 160px;position:relative;overflow:hidden}
.a .ic{width:300px;height:300px;border-radius:70px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0}
.a h1{font-size:150px;font-weight:700;line-height:1.15}
.a p{font-size:66px;opacity:.92;margin-top:24px;line-height:1.3}
.a .tap{position:absolute;right:120px;bottom:90px;font-size:56px;background:#fff;color:#b81e3d;padding:22px 56px;border-radius:999px;font-weight:700}
.row{display:grid;grid-template-columns:repeat(3,1fr);background:#fff}
.b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:50px;border-left:6px solid #f1d5da;border-top:6px solid #f1d5da}
.b:first-child{border-left:none}
.b .ic{width:230px;height:230px;border-radius:60px;background:#fde8ec;display:grid;place-items:center}
.b span{font-size:92px;font-weight:700;color:#3a1a21;text-align:center;line-height:1.15}
svg{stroke-linecap:round;stroke-linejoin:round;fill:none}
</style></head><body><div class="wrap">
<div class="a">
  <div class="ic"><svg width="180" height="180" viewBox="0 0 24 24" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></div>
  <div><h1>ข้อมูลการเรียน</h1><p>ตารางเรียน · ครูผู้สอน · สรุปการเรียน<br>การเข้าเรียน · รถรับส่ง</p></div>
  <div class="tap">แตะเพื่อดู →</div>
</div>
<div class="row">
  <div class="b"><div class="ic"><svg width="140" height="140" viewBox="0 0 24 24" stroke="#c8243f" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></div><span>สมัครเรียน</span></div>
  <div class="b"><div class="ic"><svg width="140" height="140" viewBox="0 0 24 24" stroke="#c8243f" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/></svg></div><span>นัดสอบ /<br>ทดลองเรียน</span></div>
  <div class="b"><div class="ic"><svg width="140" height="140" viewBox="0 0 24 24" stroke="#c8243f" stroke-width="2"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div><span>คุยกับแอดมิน</span></div>
</div></div></body></html>
