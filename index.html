<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NockERP — Education Operations</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     SIDEBAR
══════════════════════════════════════════════════════════ -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <div class="brand">📚 NockERP</div>
    <div class="sub">Education Operations</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Main</div>
    <div class="nav-item active" data-view="dashboard"><span class="icon">🏠</span>Dashboard</div>
    <div class="nav-item" data-view="crm"><span class="icon">🎯</span>CRM<span class="nav-badge yellow" id="badge-crm">5</span></div>
    <div class="nav-item" data-view="inbox"><span class="icon">💬</span>Inbox<span class="nav-badge" id="badge-inbox">3</span></div>
    <div class="nav-item" data-view="calendar"><span class="icon">📅</span>Calendar</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">People</div>
    <div class="nav-item" data-view="students"><span class="icon">🎓</span>Students</div>
    <div class="nav-item" data-view="families"><span class="icon">👨‍👩‍👧</span>Families</div>
    <div class="nav-item" data-view="staff"><span class="icon">👤</span>Staff</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Operations</div>
    <div class="nav-item" data-view="courses"><span class="icon">📖</span>Courses</div>
    <div class="nav-item" data-view="classes"><span class="icon">🏫</span>Classes</div>
    <div class="nav-item" data-view="sessions"><span class="icon">⏱️</span>Sessions</div>
    <div class="nav-item" data-view="attendance"><span class="icon">✅</span>Attendance</div>
    <div class="nav-item" data-view="summaries"><span class="icon">📝</span>Summaries</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Finance & Admin</div>
    <div class="nav-item" data-view="billing"><span class="icon">💳</span>Billing<span class="nav-badge" id="badge-billing">2</span></div>
    <div class="nav-item" data-view="notifications"><span class="icon">🔔</span>Notifications</div>
    <div class="nav-item" data-view="tasks"><span class="icon">☑️</span>Tasks</div>
    <div class="nav-item" data-view="reports"><span class="icon">📊</span>Reports</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">System</div>
    <div class="nav-item" data-view="settings"><span class="icon">⚙️</span>Settings</div>
    <div class="nav-item" data-view="logs"><span class="icon">🕐</span>Logs & Timeline</div>
  </div>
</nav>

<!-- ══════════════════════════════════════════════════════════
     MAIN
══════════════════════════════════════════════════════════ -->
<div id="main">

  <!-- TOP NAV -->
  <div id="topnav">
    <div class="topnav-title" id="topnav-title">Dashboard</div>
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="global-search" placeholder="Smart search…" autocomplete="off">
    </div>
    <div class="topnav-actions">
      <div class="icon-btn" data-view="notifications" title="Notifications">🔔<div class="badge-dot"></div></div>
      <div class="icon-btn" data-view="tasks" title="Tasks">☑️</div>
      <div class="avatar" title="Admin Nock">N</div>
    </div>
  </div>

  <!-- CONTENT — each view is populated by its JS module -->
  <div id="content">
    <div class="view active" id="view-dashboard"></div>
    <div class="view" id="view-crm"></div>
    <div class="view" id="view-inbox"></div>
    <div class="view" id="view-calendar"></div>
    <div class="view" id="view-students"></div>
    <div class="view" id="view-families"></div>
    <div class="view" id="view-staff"></div>
    <div class="view" id="view-courses"></div>
    <div class="view" id="view-classes"></div>
    <div class="view" id="view-sessions"></div>
    <div class="view" id="view-attendance"></div>
    <div class="view" id="view-summaries"></div>
    <div class="view" id="view-billing"></div>
    <div class="view" id="view-notifications"></div>
    <div class="view" id="view-tasks"></div>
    <div class="view" id="view-reports"></div>
    <div class="view" id="view-settings"></div>
    <div class="view" id="view-logs"></div>
  </div>

</div><!-- /main -->

<!-- ══════════════════════════════════════════════════════════
     GLOBAL MODAL CONTAINER (modules inject modals here)
══════════════════════════════════════════════════════════ -->
<div id="modals"></div>

<!-- ══════════════════════════════════════════════════════════
     SCRIPTS — load order matters
══════════════════════════════════════════════════════════ -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/crm.js"></script>
<script src="js/crm-schedule.js"></script>
<script src="js/inbox.js"></script>
<script src="js/calendar.js"></script>
<script src="js/calendar-class.js"></script>
<script src="js/students.js"></script>
<script src="js/families.js"></script>
<script src="js/staff.js"></script>
<script src="js/billing.js"></script>
<script src="js/reports.js"></script>
<script src="js/settings.js"></script>
<script src="js/placeholder.js"></script>

</body>
</html>
